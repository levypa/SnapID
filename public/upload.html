<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapID - Hospedagem de Imagens</title>
    <link rel="icon" href="https://opengptx.com.br/wp-content/uploads/2025/03/cropped-logo-ico-e1741383241280-32x32.png"
        sizes="32x32" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f6fa;
            min-height: calc(100vh - 100px);
            display: flex;
            flex-direction: column;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            flex: 1;
        }

        h1 {
            color: #2d3436;
            text-align: center;
        }

        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #dfe6e9;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: monospace;
        }

        input[type="file"] {
            margin: 10px 0;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0984e3;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #0077d6;
        }

        button:disabled {
            background: #b2bec3;
            cursor: not-allowed;
        }

        .results {
            margin-top: 20px;
        }

        .result-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .result-item.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
        }

        .result-item.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
        }

        .result-item.pending {
            background: #fff3cd;
            border: 1px solid #ffc107;
        }

        .result-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }

        .result-info {
            flex: 1;
        }

        .result-info .filename {
            font-weight: bold;
        }

        .result-info .url {
            font-size: 0.85rem;
            word-break: break-all;
            color: #0984e3;
        }

        .result-info .error-msg {
            color: #d63031;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #0984e3;
        }

        .progress-bar {
            height: 4px;
            background: #dfe6e9;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            background: #0984e3;
            transition: width 0.3s;
        }

        .file-count {
            text-align: center;
            color: #636e72;
            margin-top: 5px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #636e72;
            font-size: 0.9rem;
            margin-top: 20px;
        }

        footer a {
            color: #0984e3;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>🧪 Teste de Upload Múltiplo</h1>

        <form id="uploadForm">
            <label for="apiKey">Chave de API *</label>
            <input type="text" id="apiKey" placeholder="SUA_CHAVE_API" required>

            <label for="images">Arquivos de Imagem * (selecione vários)</label>
            <input type="file" id="images" accept="image/*" multiple required>
            <div class="file-count" id="fileCount"></div>

            <label for="expiration">Expiração (segundos, opcional)</label>
            <input type="number" id="expiration" placeholder="ex: 3600 para 1 hora">

            <button type="submit" id="submitBtn">Enviar Imagens</button>
        </form>

        <div class="progress-bar" id="progressBar" style="display: none;">
            <div class="fill" id="progressFill"></div>
        </div>

        <div class="results" id="results"></div>

        <div class="back">
            <a href="/">← Voltar para o Início</a> | <a href="/docs.html">Documentação da API</a>
        </div>
    </div>

    <footer>
        <p>© 2026 <strong>LevyPA®</strong> | <a href="https://opengptx.com.br" target="_blank">opengptx.com.br</a></p>
    </footer>

    <script>
        const savedKey = localStorage.getItem('snapid_key');
        if (savedKey) {
            document.getElementById('apiKey').value = savedKey;
        }

        const imagesInput = document.getElementById('images');
        const fileCount = document.getElementById('fileCount');

        imagesInput.addEventListener('change', () => {
            const count = imagesInput.files.length;
            fileCount.textContent = count > 0 ? `${count} arquivo(s) selecionado(s)` : '';
        });

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const apiKey = document.getElementById('apiKey').value.trim();
            const files = imagesInput.files;
            const expiration = document.getElementById('expiration').value;

            if (!apiKey || files.length === 0) {
                alert('Chave de API e pelo menos uma imagem são obrigatórios');
                return;
            }

            localStorage.setItem('snapid_key', apiKey);

            const submitBtn = document.getElementById('submitBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const resultsDiv = document.getElementById('results');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';
            progressBar.style.display = 'block';
            resultsDiv.innerHTML = '';

            let completed = 0;
            const total = files.length;

            for (const file of files) {
                const resultItem = document.createElement('div');
                resultItem.className = 'result-item pending';
                resultItem.innerHTML = `
                <div class="result-info">
                    <div class="filename">${file.name}</div>
                    <div class="status">Enviando...</div>
                </div>
            `;
                resultsDiv.appendChild(resultItem);

                try {
                    const formData = new FormData();
                    formData.append('image', file);
                    if (expiration) {
                        formData.append('expiration', expiration);
                    }

                    const res = await fetch(`/upload?key=${apiKey}`, {
                        method: 'POST',
                        body: formData
                    });
                    const data = await res.json();

                    if (data.success) {
                        resultItem.className = 'result-item success';
                        resultItem.innerHTML = `
                        <img src="${data.data.url}" alt="${file.name}">
                        <div class="result-info">
                            <div class="filename">${file.name}</div>
                            <div class="url"><a href="${data.data.url}" target="_blank">${data.data.url}</a></div>
                        </div>
                    `;
                    } else {
                        resultItem.className = 'result-item error';
                        resultItem.innerHTML = `
                        <div class="result-info">
                            <div class="filename">${file.name}</div>
                            <div class="error-msg">Erro: ${data.error}</div>
                        </div>
                    `;
                    }
                } catch (err) {
                    resultItem.className = 'result-item error';
                    resultItem.innerHTML = `
                    <div class="result-info">
                        <div class="filename">${file.name}</div>
                        <div class="error-msg">Erro de Rede</div>
                    </div>
                `;
                }

                completed++;
                progressFill.style.width = `${(completed / total) * 100}%`;
            }

            submitBtn.disabled = false;
            submitBtn.textContent = 'Enviar Imagens';
        });
    </script>

</body>

</html>
